services:
  db:
    image: mysql:8.0
    container_name: taller_db
    restart: unless-stopped
    command: --lower_case_table_names=0 --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: tallerdb
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taller_net

  redis:
    image: redis:7-alpine
    container_name: taller_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    networks:
      - taller_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taller_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - taller_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taller_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - taller_net

networks:
  taller_net:
    driver: bridge

volumes:
  db_data:
